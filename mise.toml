[tools]
node = "26.13.0"
pnpm = "12.17.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.32.0"
shellcheck = "0.11.0"

[tasks.install]
description = "Install the JavaScript workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.verify]
description = "Run the checks the change can affect (same as the verify check in CI)"
depends = ["install"]
run = "node packages/tooling/src/verify.ts"
